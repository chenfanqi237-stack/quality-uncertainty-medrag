seed: 42

paths:
  questions: ../data/synthetic_medqa.jsonl
  evidence: ../data/synthetic_evidence.jsonl
  output_dir: ../outputs/baseline

run:
  top_k: 3

quality:
  scorer_name: configured-evidence-type-baseline
  evidence_type_scores:
    meta_analysis: 1.0
    systematic_review: 0.9
    evidence_based_guideline: 0.8
    randomized_controlled_trial: 0.7
    non_randomized_controlled_trial: 0.6
    cohort_study: 0.5
    case_series_or_study: 0.4
    individual_case_report: 0.3
    expert_opinion: 0.2
    other: 0.1

logging:
  level: INFO

